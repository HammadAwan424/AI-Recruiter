[project]
name = "airecruiter-backend"
version = "0.1.0"
description = "AI Recruiter FastAPI Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic[email]",
    "email-validator",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "python-jose",
    "passlib[bcrypt]",
    "PyMuPDF",
    "langchain-groq",
    "langchain-core",
    "langgraph",
    "mcp",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2"
]

[tool.vercel]
entrypoint = "app.main:app"
